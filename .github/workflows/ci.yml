name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  pull-request-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Squash merges use the PR title as the commit message, and semantic-release
      # reads that message to decide the next version. Validate it before merging.
      - name: Lint PR title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PULL_REQUEST_TITLE" | npx commitlint --verbose

  verify:
    name: Lint · Typecheck · Test · Build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
