name: Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag, release commit, GitHub Release
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on PRs included in the release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Release
        env:
          # If `main` has a ruleset that blocks direct pushes, replace this with a token
          # (GitHub App or PAT) allowed to bypass it, so the release commit can be pushed.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
